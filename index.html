<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мой план</title>
  <meta name="theme-color" content="#1f2937">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt=""><span>Мой план</span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="calendar"><i data-ic="calendar"></i><span>Календарь</span></button>
      <button class="tab" data-tab="map"><i data-ic="globe"></i><span>Карта мира</span></button>
      <button class="tab" data-tab="dash"><i data-ic="chart"></i><span>Аналитика</span></button>
    </nav>
    <div class="wallet">
      <span title="Алмазы"><i data-ic="gem" data-cls="gem"></i><b id="w-diamonds">0</b></span>
      <button class="wallet-btn" id="w-tiyn-btn" title="Тиын — нажми, чтобы обменять"><i data-ic="tiyn" data-cls="tiyn"></i><b id="w-tiyn">0</b></button>
      <button class="wallet-btn" id="w-gold-btn" title="Золото — нажми, чтобы обменять на алмазы"><i data-ic="coin" data-cls="coin"></i><b id="w-gold">0</b></button>
      <span id="sync-status" class="sync"></span>
      <button class="icon-btn" id="btn-settings" title="Настройки"><i data-ic="settings"></i></button>
    </div>
  </header>

  <!-- ===== КАЛЕНДАРЬ ===== -->
  <main id="page-calendar" class="page active">
    <section class="cal-main">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="icon-btn" id="cal-prev" aria-label="Прошлый месяц"><i data-ic="left"></i></button>
          <button class="cal-title" id="cal-title">Ноябрь 2026</button>
          <button class="icon-btn" id="cal-next" aria-label="Следующий месяц"><i data-ic="right"></i></button>
          <button class="btn-ghost" id="cal-today">Сегодня</button>
        </div>
        <div class="cal-actions">
        <button class="btn-inbox" id="btn-inbox" title="Напоминалки и несделанное"><i data-ic="bell"></i><span class="long-lbl">Напоминалки</span> <b id="inbox-count" class="inbox-pill hidden">0</b></button>
        <button class="btn-add" id="btn-add"><i data-ic="plus"></i><span class="long-lbl">Добавить задачу</span><span class="short-lbl">Задача</span></button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="legend">
        <span><i class="dot yellow"></i>не срочно</span>
        <span><i class="dot orange"></i>важно</span>
        <span><i class="dot red"></i>очень важно</span>
        <span><i class="dot black"></i>дедлайн</span>
        <span><i class="dot blue"></i>цель</span>
        <span><i class="dot green"></i>отдых</span>
        <span><i class="dot gray"></i>встреча</span>
        <span><i class="dot school"></i>школа</span>
      </div>
    </section>
    <aside class="cal-side">
      <div class="card" id="side-inbox-card">
        <h3><i data-ic="bell"></i> Напоминалки</h3>
        <div id="side-inbox"></div>
      </div>
      <div class="card">
        <h3><i data-ic="clock"></i> Сегодня</h3>
        <div id="side-today"></div>
      </div>
      <div class="card">
        <h3><i data-ic="flag"></i> Дедлайны</h3>
        <div id="side-deadlines"></div>
      </div>
      <div class="card">
        <h3><i data-ic="target"></i> Долгосрочные цели</h3>
        <div id="side-goals"></div>
      </div>
      <div class="card">
        <h3><i data-ic="calendar"></i> Ближайшие 7 дней</h3>
        <div id="side-soon"></div>
      </div>
    </aside>
  </main>

  <!-- ===== КАРТА ===== -->
  <main id="page-map" class="page">
    <div class="map-area">
      <div class="map-stats" id="map-stats"></div>
      <div id="map-wrap"><canvas id="map"></canvas></div>
      <div class="map-tools">
        <button class="btn-tool shop" id="btn-shop"><i data-ic="store"></i><span>Магазин</span></button>
        <button class="btn-tool" id="btn-lb" title="Таблица лидеров"><i data-ic="trophy"></i><span>Лидеры</span> <b id="my-rank" class="rank-pill">#—</b></button>
        <button class="btn-tool" id="btn-army" title="Армия: военные базы и корм"><i data-ic="power"></i><span>Армия</span> <b id="army-lvl" class="army-pill">0</b></button>
        <button class="btn-tool" id="btn-inv" title="Инвентарь: предметы за золото"><i data-ic="bag"></i><span>Инвентарь</span> <b id="inv-count" class="army-pill hidden">0</b></button>
        <button class="btn-tool" id="btn-diplo" title="Дипломатия и почта"><i data-ic="mail"></i><span>Дипломатия</span> <b id="mail-count" class="mail-pill hidden">0</b></button>
        <button class="btn-tool" id="btn-capture"><i data-ic="swords"></i><span>Захват</span> <b id="charges">0</b></button>
        <button class="btn-tool" id="btn-home" title="К Казахстану"><i data-ic="crosshair"></i></button>
        <button class="btn-tool" id="btn-zin" title="Приблизить"><i data-ic="plus"></i></button>
        <button class="btn-tool" id="btn-zout" title="Отдалить"><i data-ic="minus"></i></button>
        <button class="btn-tool chat-toggle" id="btn-chat" title="Хроника"><i data-ic="chat"></i></button>
      </div>
      <div class="mode-bar hidden" id="mode-bar"><span id="mode-text"></span><button id="mode-cancel">Отмена</button></div>
      <div class="cell-info hidden" id="cell-info"></div>
      <div class="lb hidden" id="lb"></div>
    </div>
    <aside class="chat" id="chat">
      <div class="chat-head">
        <h3><i data-ic="chat"></i> Хроника</h3>
        <div class="chat-filter" id="chat-filter">
          <button class="active" data-f="all">Все</button>
          <button data-f="me">Мои</button>
          <button data-f="war">Войны</button>
          <button data-f="event">События</button>
        </div>
      </div>
      <div class="chat-log" id="chat-log"></div>
    </aside>
  </main>

  <!-- ===== АНАЛИТИКА ===== -->
  <main id="page-dash" class="page">
    <div class="dash">
      <div class="dash-tabs" id="dash-tabs"></div>
      <div id="dash-body"></div>
    </div>
  </main>

  <div class="overlay hidden" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="data/world.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/school.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/game.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/buildings.js"></script>
  <script src="js/world.js"></script>
  <script src="js/diplomacy.js"></script>
  <script src="js/military.js"></script>
  <script src="js/items.js"></script>
  <script src="js/inbox.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/map.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
